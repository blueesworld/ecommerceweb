<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECommerce Pro – Admin</title>
<style>
:root{--bg:#f1f1f1;--card:#fff;--line:#e3e3e3;--t1:#303030;--t2:#616161;--t3:#8a8a8a;--green:#008060;--gd:#006e52;--dark:#1a1a1a;--red:#d72c0d;--blue:#2a7de1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.top{position:fixed;inset:0 0 auto 0;height:56px;background:var(--dark);display:flex;align-items:center;gap:16px;padding:0 16px;z-index:20;color:#fff}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;width:208px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--green);display:grid;place-items:center;font-style:normal}
.srch{flex:1;max-width:560px;margin:0 auto;background:#303030;border-radius:10px;display:flex;align-items:center;padding:0 12px;height:36px;gap:8px}
.srch input{flex:1;background:none;border:0;outline:0;color:#fff}.srch input::placeholder{color:#a8a8a8}
.tbtn{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}.tbtn:hover{background:#303030}
.tbtn b{position:absolute;top:0;right:0;background:var(--red);border-radius:8px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.shop{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:10px;background:#303030;font-weight:600}
.shop i{width:28px;height:28px;border-radius:7px;background:var(--green);display:grid;place-items:center;font-style:normal;font-size:12px}
.side{position:fixed;top:56px;bottom:0;left:0;width:232px;padding:12px 10px;overflow:auto}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-weight:550;color:var(--t1);text-align:left}
.nav:hover{background:#e3e3e3}.nav.on{background:#fff;box-shadow:0 0 0 1px var(--line)}
.nav svg{width:18px;height:18px;flex:none}
.nav em{margin-left:auto;font-style:normal;background:#e3e3e3;border-radius:8px;padding:0 7px;font-size:12px}
.sl{font-size:12px;font-weight:650;color:var(--t2);padding:16px 10px 6px}
main{margin:56px 0 0 232px;padding:24px 28px 60px;max-width:1240px}
h1{font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line),0 1px 0 rgba(0,0,0,.04);margin-bottom:16px;overflow:hidden}
.pad{padding:16px}.ct{font-weight:650;font-size:14px;margin-bottom:8px}
.grid{display:grid;gap:16px}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.kpi{padding:14px 16px;border-right:1px solid var(--line);cursor:pointer;text-align:left;border-bottom:3px solid transparent}
.kpi:last-child{border-right:0}.kpi:hover{background:#fafafa}.kpi.on{border-bottom-color:var(--blue);background:#f7fbff}
.kpi span{display:block;font-size:12.5px;color:var(--t2);font-weight:550}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:2px}
.d{font-size:12.5px;font-weight:650}.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--t3)}
.kr{display:flex;overflow:hidden}.kr .kpi{flex:1}
.chartw{position:relative;padding:8px 16px 14px}.chartw svg{width:100%;height:240px;display:block}
.tip{position:absolute;top:6px;background:#303030;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none;transform:translateX(-50%);display:none;white-space:nowrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;color:var(--t2);font-weight:600;padding:10px 16px;background:#f7f7f7;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid #ededed;vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr[data-id]{cursor:pointer}tbody tr[data-id]:hover{background:#f7f7f7}
.r{text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:8px;background:#e3e3e3;color:#4a4a4a;margin-right:4px}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}
.by{background:#ffd6a4;color:#5e4200}.bg{background:#cdfee1;color:#0c5132}.br{background:#fed3d1;color:#8e1f0b}
.th{width:36px;height:36px;border-radius:8px;background:#f4f4f4;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:19px;vertical-align:middle;margin-right:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:9px;font-weight:600;background:#fff;box-shadow:0 0 0 1px #c9c9c9,0 1px 0 rgba(0,0,0,.05)}
.btn:hover{background:#f6f6f6}.btn.p{background:var(--dark);color:#fff;box-shadow:none}.btn.p:hover{background:#303030}
.btn.g{background:var(--green);color:#fff;box-shadow:none}.btn.g:hover{background:var(--gd)}.btn.x{color:var(--red)}
.tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tab{padding:5px 12px;border-radius:8px;font-weight:600;color:var(--t2)}.tab.on{background:#e9e9e9;color:var(--t1)}
.tabs input{margin-left:auto;border:1px solid #c9c9c9;border-radius:8px;padding:6px 10px;width:240px;outline:0}
.f{margin-bottom:12px}.f label{display:block;font-weight:600;margin-bottom:5px}
.f input,.f select{width:100%;border:1px solid #c9c9c9;border-radius:8px;padding:8px 10px;outline:0;background:#fff}
.f input:focus,.f select:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(0,128,96,.2)}
.row2{display:flex;gap:12px}.row2>*{flex:1}
.sw{width:40px;height:24px;border-radius:12px;background:#c9c9c9;position:relative;flex:none;cursor:pointer;transition:.2s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--green)}.sw.on:after{transform:translateX(16px)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ededed}.tg:last-child{border:0}
.tg span{display:block;color:var(--t2);font-size:12.5px}
.emp{text-align:center;padding:40px 20px;color:var(--t2)}.emp h3{color:var(--t1);margin-bottom:6px}.emp .btn{margin-top:12px}
.seg{display:flex;background:#e9e9e9;border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:6px;border-radius:7px;font-weight:600;color:var(--t2)}.seg .on{background:#fff;color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.step{display:flex;gap:12px;padding:12px 16px;border-top:1px solid #ededed;cursor:pointer;align-items:center}.step:hover{background:#fafafa}
.chk{width:20px;height:20px;border-radius:50%;border:2px dashed #b5b5b5;flex:none;display:grid;place-items:center;color:#fff;font-size:11px}
.step.done .chk{background:var(--green);border:0}.step.done b{color:var(--t3);text-decoration:line-through}
.bar{height:6px;background:#e3e3e3;border-radius:3px;margin-top:8px}.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}.ov.show{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100%;background:var(--bg);z-index:41;transform:translateX(105%);transition:transform .3s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.dr.show{transform:none}.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.db{flex:1;overflow:auto;padding:16px}
.ban{position:fixed;top:66px;right:16px;width:340px;background:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:60;transform:translateX(120%);transition:transform .4s cubic-bezier(.2,.9,.25,1.05);cursor:pointer}
.ban.show{transform:none}.ban i{width:34px;height:34px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;flex:none}
.ban b{display:block}.ban span{color:var(--t2);font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#303030;color:#fff;padding:9px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:90;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.ob{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;place-items:center}.ob.show{display:grid}
.obc{width:420px;max-width:92vw;background:#fff;border-radius:16px;padding:32px;box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.1)}
.obc h2{font-size:24px;letter-spacing:-.02em;margin:14px 0 6px}.obc p{color:var(--t2);margin-bottom:18px}
.hint{color:var(--t2);font-size:12.5px;margin-top:6px}
@media(max-width:900px){.side{display:none}main{margin-left:0;padding:16px}.g5,.g2,.g2e{grid-template-columns:1fr}.kr{flex-wrap:wrap}.logo{width:auto}}
/* ===== glass / dark-light ===== */
body{background:radial-gradient(900px 500px at 85% -5%,#cfe6ff 0,transparent 60%),radial-gradient(700px 500px at 15% 110%,#e6dcff 0,transparent 60%),#f1f1f1;background-attachment:fixed}
.top{background:rgba(14,14,16,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}
.srch,.shop{background:rgba(255,255,255,.1);border-radius:999px;box-shadow:inset 0 1px 1px rgba(255,255,255,.18);transition:background .25s}
.srch:focus-within{background:rgba(255,255,255,.18)}.shop{cursor:pointer}.tbtn:hover{background:rgba(255,255,255,.12)}
.side{background:linear-gradient(180deg,#0b0b0d,#1c1c21);color:#fff;padding:14px 12px}
#side{position:relative}
.nav{position:relative;z-index:1;color:#d0d0d5;border-radius:12px;transition:color .25s,transform .3s cubic-bezier(.34,1.56,.64,1);margin-bottom:2px}
.nav:hover{background:rgba(255,255,255,.07);transform:translateX(3px)}.nav.on{background:none;box-shadow:none;color:#fff}
.nav em{background:var(--green);color:#fff}.sl{color:#8e8e93}
#lens{position:absolute;left:12px;right:12px;top:0;height:36px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.07));box-shadow:inset 0 1px 1px rgba(255,255,255,.38),0 6px 16px rgba(0,0,0,.45);transition:transform .55s cubic-bezier(.34,1.35,.5,1),height .3s;pointer-events:none;z-index:0}
.card{background:rgba(255,255,255,.7);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-radius:24px;box-shadow:inset 0 1px 1px rgba(255,255,255,.95),0 0 0 1px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.05);transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.grid>div>.card:hover,.grid>.card:hover{transform:translateY(-2px);box-shadow:inset 0 1px 1px #fff,0 0 0 1px rgba(0,0,0,.06),0 18px 40px rgba(0,0,0,.09)}
.btn{border-radius:999px;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);box-shadow:inset 0 1px 1px #fff,0 0 0 1px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.05);transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}
.btn:hover{transform:translateY(-1px);background:#fff}.btn:active{transform:scale(.95)}
.btn.g{background:linear-gradient(180deg,#12a47e,#008060);box-shadow:inset 0 1px 1px rgba(255,255,255,.38),0 8px 20px rgba(0,128,96,.3)}
.btn.p{background:linear-gradient(180deg,#2a2a2d,#111)}
.tab,.seg,.seg button,.badge,.tabs input,.f input,.f select{border-radius:999px}.f input,.f select{padding:9px 14px}
.tab{transition:background .2s,transform .2s}.tab:active{transform:scale(.94)}
th{background:rgba(247,247,247,.55)}tbody tr{transition:background .15s}
.hero{position:relative;overflow:hidden;border-radius:32px;padding:24px 24px 10px;margin-bottom:18px;color:#fff;background:radial-gradient(520px 280px at 92% 0,rgba(42,167,255,.3),transparent 70%),radial-gradient(440px 260px at 0 100%,rgba(138,47,201,.32),transparent 70%),#000;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.hh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gr{font-size:28px;font-weight:650;letter-spacing:-.025em}.gs{color:#9a9aa0;font-size:15px;margin-top:2px}
.gl{appearance:none;color:#fff;font-weight:600;padding:10px 20px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(16px);box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 6px 16px rgba(0,0,0,.35);cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.gl:active{transform:scale(.94)}.gl option{color:#000}
.mets{display:flex;gap:6px;overflow-x:auto;padding:20px 0 8px}
.hero .kpi{flex:none;border:1px solid transparent;border-radius:24px;padding:10px 18px;background:none;color:#fff;cursor:pointer;transition:background .35s,border-color .35s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.hero .kpi:hover{background:rgba(255,255,255,.07)}.hero .kpi:active{transform:scale(.95)}
.hero .kpi.on{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border-color:rgba(255,255,255,.15);backdrop-filter:blur(16px);box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.35)}
.hero .kpi.live{cursor:default}.hero .kpi span{color:#d6d6da;font-size:14px}.hero .kpi b{font-size:23px;display:flex;align-items:center;gap:8px;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .d{font-size:13.5px}.hero .d.up{color:#34d27b}.hero .d.down{color:#ff6b5e}
.ring{width:20px;height:20px;border-radius:50%;border:2.2px dotted #34d27b;position:relative;display:inline-block;animation:spin 7s linear infinite}
.ring:after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:#34d27b;animation:pulse 1.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(.7);opacity:.7}50%{transform:scale(1);opacity:1}}
.hero .chartw{padding:6px 0 12px}.chartw svg{height:270px}
.tip{background:rgba(58,58,64,.62);backdrop-filter:blur(16px) saturate(170%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 8px 22px rgba(0,0,0,.4);border-radius:14px;padding:8px 14px}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}#csvg.wipe{animation:wipe 1.1s cubic-bezier(.3,.7,.2,1) both}
.ms{background:linear-gradient(180deg,#000,#222225 55%,#6c6c72);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
main.anim>*{animation:rise .6s cubic-bezier(.2,.85,.25,1) both}
main.anim>:nth-child(2){animation-delay:.06s}main.anim>:nth-child(3){animation-delay:.12s}main.anim>:nth-child(4){animation-delay:.18s}main.anim>:nth-child(n+5){animation-delay:.24s}
.ov{display:block;opacity:0;pointer-events:none;transition:opacity .3s}.ov.show{opacity:1;pointer-events:auto;backdrop-filter:blur(4px)}
.dr{background:rgba(243,243,246,.78);backdrop-filter:blur(36px) saturate(200%);-webkit-backdrop-filter:blur(36px) saturate(200%);border-radius:30px 0 0 30px;transition:transform .55s cubic-bezier(.32,.72,0,1);box-shadow:inset 1.5px 0 1px rgba(255,255,255,.95),-16px 0 50px rgba(0,0,0,.22)}
.dh{background:transparent;border:0}
.ban{background:rgba(245,245,248,.74);backdrop-filter:blur(30px) saturate(200%);border-radius:24px;box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 14px 38px rgba(0,0,0,.3)}
.toast{background:rgba(32,32,36,.72);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.14);border-radius:999px;box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 10px 28px rgba(0,0,0,.3)}
.obc{border-radius:32px;background:rgba(255,255,255,.8);backdrop-filter:blur(30px)}
.sw{transition:background .25s}.sw:after{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v3: helle Glas-Sidebar wie Shopify ===== */
.side{display:flex;flex-direction:column;background:rgba(238,238,242,.62);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);color:var(--t1);box-shadow:inset -1px 0 0 rgba(0,0,0,.07)}
#side{flex:1;display:flex;flex-direction:column}
.nav{color:#424247}.nav:hover{background:rgba(0,0,0,.05)}.nav.on{color:#111}.nav em{background:#1a1a1a;color:#fff}.sl{color:#6a6a70}
#lens{background:linear-gradient(180deg,#fff,rgba(255,255,255,.72));box-shadow:inset 0 1px 1px #fff,0 0 0 1px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.1)}
kbd{font:11px inherit;background:rgba(255,255,255,.12);border-radius:6px;padding:1px 7px;color:#c4c4c9}
.strip{display:flex;flex-wrap:wrap}.strip>div{flex:1;min-width:140px;padding:14px 18px;border-right:1px solid rgba(0,0,0,.07)}.strip>div:last-child{border:0}.strip span{color:var(--t2);font-size:12.5px;font-weight:550}.strip b{display:block;font-size:20px;letter-spacing:-.02em}
.btn[disabled]{opacity:.45;pointer-events:none}
.logo svg{flex:none}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z" fill="#008060" stroke="#008060"/><path d="M9 8V7a3 3 0 0 1 6 0v1" stroke="#fff"/></svg><span>ECommerce Pro</span></div>
  <div class="srch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a8a8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="gq" placeholder="Bestellungen, Produkte, Kunden suchen"><kbd>Strg K</kbd></div>
  <button class="tbtn" id="bell" title="Mitteilungen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><b id="bc" style="display:none">0</b></button>
  <div class="shop"><i id="si">M</i><span id="sn">Mein Shop</span></div>
</header>
<aside class="side"><i id="lens"></i><div id="side"></div></aside>
<main id="main" class="anim"></main>
<div class="ov" id="ov"></div>
<div class="dr" id="dr"><div class="dh"><span id="dt"></span><button class="btn" id="dx">Schließen</button></div><div class="db" id="db"></div></div>
<div class="ban" id="ban"><i>E</i><div><b id="bt"></b><span id="bm"></span></div></div>
<div class="toast" id="toast"></div>
<div class="ob" id="ob"></div>

<script>
(function(){
"use strict";
const KEY="ecommercepro_shopify_v1";
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const FIRST=["Lena","Jonas","Mia","Elif","Noah","Sophie","Kevin","Amira","Finn","Leonie","David","Laura","Tarek","Julia","Max","Emma"];
const LAST=["Müller","Schmidt","Yilmaz","Becker","Hoffmann","Kaya","Wagner","Fischer","Weber","Hassan","Koch","Richter"];

function chime(){if(!S.admin.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;[[880,0],[1318.5,.14],[1760,.28]].forEach(([f,o])=>{const os=actx.createOscillator(),g=actx.createGain();os.type="sine";os.frequency.value=f;os.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.2,t+o+.01);g.gain.exponentialRampToValueAtTime(.0001,t+o+.6);os.start(t+o);os.stop(t+o+.65)})}catch(e){}}

/* data helpers */
function daySeries(days,off){const out=[];const base=new Date();base.setHours(12,0,0,0);for(let i=days-1;i>=0;i--){const d=new Date(base);d.setDate(d.getDate()-i-off);const k=dkey(d);const os=S.orders.filter(o=>dkey(o.date)===k);const sales=os.reduce((t,o)=>t+o.total,0);const ses=(S.sessions&&S.sessions[k])||0;out.push({d,sales,orders:os.length,sessions:ses,conv:ses?Math.min(100,os.length/ses*100):0,aov:os.length?sales/os.length:0})}return out}
function agg(s){const sales=s.reduce((t,x)=>t+x.sales,0),orders=s.reduce((t,x)=>t+x.orders,0),sessions=s.reduce((t,x)=>t+x.sessions,0);return{sales,orders,sessions,conv:sessions?Math.min(100,orders/sessions*100):0,aov:orders?sales/orders:0}}
function fm(k,v){if(k==="sales"||k==="aov")return fmt(v);if(k==="conv")return v.toFixed(1).replace(".",",")+"%";return Math.round(v).toLocaleString("de-DE")}
function delta(c,p){if(p>0){const pc=(c-p)/p*100;return{cls:pc>.05?"up":pc<-.05?"down":"flat",txt:(pc>0?"+":"")+(Math.round(pc*10)/10).toString().replace(".",",")+"%"}}return c>0?{cls:"up",txt:"Neu"}:{cls:"flat",txt:"–"}}
const badges=o=>(o.paid?'<span class="badge">Bezahlt</span>':'<span class="badge by">Zahlung ausstehend</span>')+(o.fulfilled?'<span class="badge">Versendet</span>':'<span class="badge by">Nicht versendet</span>');
function randomCustomer(){const f=rnd(FIRST),l=rnd(LAST);return{name:f+" "+l.charAt(0)+".",email:(f+"."+l).toLowerCase().replace(/ü/g,"ue").replace(/ö/g,"oe").replace(/ä/g,"ae")+"@mail.de",city:rnd(CITIES)}}
function makeOrder(o){
  const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0),total=o.percent?sub*(1-o.percent/100):sub;S.orderSeq++;
  const ord={id:uid(),no:S.orderSeq,customer:o.customer,email:o.email,city:o.city,items:o.items.map(i=>({pid:i.pid,name:i.name,emoji:i.emoji,price:i.price,qty:i.qty})),total,paid:o.paid,fulfilled:false,date:o.date||new Date().toISOString(),source:o.source||"Online-Shop"};
  S.orders.push(ord);
  if(!o.noStock)o.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p)p.stock=Math.max(0,p.stock-i.qty)});
  const n=rint(8,26);S.visitors+=n;S.sessions=S.sessions||{};const k=dkey(ord.date);S.sessions[k]=(S.sessions[k]||0)+n;save();return ord}
function notifyOrder(o){
  const l=o.items[0],rest=o.items.length>1?` +${o.items.length-1} weitere`:"",title=`${S.settings.shopName}: Neue Bestellung #${o.no}`,msg=`${fmt(o.total)} von ${o.customer} · ${l.qty}× ${l.name}${rest}`;
  S.notifications.unshift({id:uid(),title,msg,date:o.date,read:false,orderId:o.id});S.notifications=S.notifications.slice(0,100);save();
  if(S.admin.banner)banner(title,msg,o.id);chime();render()}
function buildSim(){
  const A=S.admin,cu=A.customer.trim()?{name:A.customer.trim(),email:A.customer.trim().toLowerCase().replace(/\s+/g,".")+"@mail.de",city:rnd(CITIES)}:randomCustomer(),act=S.products.filter(p=>p.active);let items;
  if(A.mode==="custom"||!act.length)items=[{pid:null,name:A.customName.trim()||"Eigener Artikel",emoji:"📦",price:parseFloat(A.customPrice)||rint(19,189),qty:Math.max(1,A.qty)}];
  else if(A.mode==="pick"){const p=S.products.find(x=>x.id===A.productId)||act[0];items=[{pid:p.id,name:p.name,emoji:p.emoji,price:p.price,qty:Math.max(1,A.qty)}]}
  else items=[...act].sort(()=>Math.random()-.5).slice(0,rint(1,Math.min(3,act.length))).map(p=>({pid:p.id,name:p.name,emoji:p.emoji,price:p.price,qty:rint(1,2)}));
  return makeOrder({customer:cu.name,email:cu.email,city:cu.city,items,paid:A.paid})}
const fire=n=>{for(let i=0;i<n;i++)setTimeout(()=>notifyOrder(buildSim()),i*1500)};

function startAuto(){stopAuto();const loop=()=>{const A=S.admin;auto=setTimeout(()=>{fire(1);loop()},rint(A.autoMin,Math.max(A.autoMin,A.autoMax))*1000)};loop()}
function seed(){
  const pool=S.products.length?S.products.map(x=>({pid:x.id,name:x.name,emoji:x.emoji,price:x.price})):SAMPLE.map(x=>({pid:null,name:x.name,emoji:x.emoji,price:x.price}));
  for(let b=29;b>=0;b--){const d=new Date();d.setDate(d.getDate()-b);const sp=Math.random()<.12,n=Math.round(sp?rint(9,14):rint(0,6));
    for(let i=0;i<n;i++){const dt=new Date(d);dt.setHours(rint(7,22),rint(0,59));if(dt>new Date())continue;const cu=randomCustomer();
      const o=makeOrder({customer:cu.name,email:cu.email,city:cu.city,items:[...pool].sort(()=>Math.random()-.5).slice(0,rint(1,2)).map(x=>({...x,qty:rint(1,2)})),paid:true,date:dt.toISOString(),noStock:true,source:rnd(["Online-Shop","Instagram","Direkt","Suche"])});o.fulfilled=b>1||Math.random()<.5}
    const k=dkey(d);S.sessions[k]=(S.sessions[k]||0)+rint(18,60)*(sp?3:1)}
  save()}

function liveN(){const t=Date.now();return Math.min(9,Math.max(1,S.orders.filter(o=>t-new Date(o.date)<20*60000).length+1))}
function pHome(el){
  const r=V.range,cur=daySeries(r,0),prev=daySeries(r,r),a=agg(cur),p=agg(prev),k=V.metric;
  const kp=METRICS.map(([m,l])=>{const d=delta(a[m],p[m]);return `<button class="kpi ${k===m?"on":""}" data-k="${m}"><span>${l}</span><b data-m="${m}" data-v="${a[m]}">${fm(m,a[m])}</b><span class="d ${d.cls}">${d.txt}</span></button>`}).join("");

const CW=800,CH=240,CL=48,CR=10,CT=12,CB=26;
function niceMax(v){if(v<=0)return 4;const e=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,1.2,1.6,2,2.4,3,4,5,6,8,10])if(m*e>=v*1.08)return m*e;return 10*e}
function chartSvg(cur,prev,k){
  const v=cur.map(x=>x[k]),pv=prev.map(x=>x[k]),mx=niceMax(Math.max(...v,...pv,0)),n=v.length,pw=CW-CL-CR,ph=CH-CT-CB;
  const X=i=>CL+i/(n-1)*pw,Y=x=>CT+ph-Math.min(1,x/mx)*ph,path=a=>a.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x).toFixed(1)).join(" ");
  const grid=[0,.5,1].map(t=>`<line x1="${CL}" x2="${CW-CR}" y1="${Y(mx*t)}" y2="${Y(mx*t)}" stroke="rgba(255,255,255,.14)"/><text x="${CL-8}" y="${Y(mx*t)+4}" text-anchor="end" fill="#a3a3a9" font-size="11">${fm(k,mx*t).replace(/,\d\d/,"")}</text>`).join("");
  const xl=[0,Math.floor((n-1)/2),n-1].map((i,j)=>`<text x="${X(i)}" y="${CH-6}" text-anchor="${j===0?"start":j===2?"end":"middle"}" fill="#a3a3a9" font-size="11">${cur[i].d.toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</text>`).join("");
  return `<svg viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="none" id="csvg" class="${V.wipe||V.fresh?"wipe":""}">${grid}<path d="${path(pv)}" fill="none" stroke="#7a7a80" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><path d="${path(v)} L${X(n-1)} ${Y(0)} L${X(0)} ${Y(0)}Z" fill="#2aa7ff" opacity=".14"/><path d="${path(v)}" fill="none" stroke="#2aa7ff" stroke-width="2.4" stroke-linejoin="round"/>${xl}<line id="cl" y1="${CT}" y2="${CT+ph}" stroke="rgba(255,255,255,.5)" style="display:none"/><circle id="cd" r="5" fill="#2aa7ff" stroke="#000" stroke-width="2" style="display:none"/></svg>`}
function bindChart(cur,k){
  const w=$("cw");if(!w)return;
  w.onmousemove=e=>{const s=$("csvg").getBoundingClientRect(),n=cur.length,x=(e.clientX-s.left)/s.width*CW;let i=Math.round((x-CL)/(CW-CL-CR)*(n-1));i=Math.max(0,Math.min(n-1,i));
    const mx=niceMax(Math.max(...cur.map(c=>c[k]),0.0001)),px=CL+i/(n-1)*(CW-CL-CR);
    const vals=cur.map(c=>c[k]),m2=niceMax(Math.max(...vals,...daySeries(V.range,V.range).map(c=>c[k]),0)),py=CT+(CH-CT-CB)-Math.min(1,vals[i]/m2)*(CH-CT-CB);
    $("cl").setAttribute("x1",px);$("cl").setAttribute("x2",px);$("cl").style.display="";$("cd").setAttribute("cx",px);$("cd").setAttribute("cy",py);$("cd").style.display="";
    const t=$("tip");t.style.display="block";t.style.left=(px/CW*s.width+16)+"px";t.innerHTML=`<b>${fm(k,vals[i])}</b> · ${cur[i].d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"})}`};
  w.onmouseleave=()=>{$("tip").style.display="none";$("cl").style.display="none";$("cd").style.display="none"}}
function step(k){
  if(k==="addprod"){go("products");openProduct()}
  else if(k==="theme"){S.setup.theme=true;save();toast("Design gespeichert");render()}

  else if(k==="domain"){S.setup.domain=true;S.settings.domain=S.settings.domain||"mein-shop";save();toast("Domain gespeichert");render()}
  else go("admin")}

function pShop(el){

  el.innerHTML=`<h1>Online-Shop<button class="btn g" id="co" ${cnt?"":"disabled"}>Zur Kasse · ${cnt} Artikel · ${fmt(tot)}</button></h1>
  <div class="hero" style="padding-bottom:24px"><div class="gs">${esc((S.settings.domain||"shop")+".ecommerce-pro.app")}</div><div class="gr">${esc(S.settings.shopName)}</div><div class="gs">So sehen deine Kunden den Shop. Jeder Test-Kauf erzeugt eine Bestellung und eine Mitteilung.</div></div>
  ${act.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${act.map(p=>`<div class="card" style="margin:0"><div style="height:130px;display:grid;place-items:center;font-size:56px;background:rgba(0,0,0,.04)">${p.emoji}</div><div class="pad"><b>${esc(p.name)}</b><div style="margin:4px 0 10px">${fmt(p.price)}</div><button class="btn" data-add="${p.id}" style="width:100%">In den Warenkorb</button></div></div>`).join("")}</div>`:`<div class="card"><div class="emp"><h3>Keine aktiven Produkte</h3>Füge Produkte hinzu, um den Shop zu testen.</div></div>`}`;
  el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{V.cart[b.dataset.add]=(V.cart[b.dataset.add]||0)+1;toast("Zum Warenkorb hinzugefügt");pShop(el)});
  $("co").onclick=()=>{
    const items=Object.entries(V.cart).map(([id,q])=>{const p=S.products.find(x=>x.id===id);return p?{pid:id,name:p.name,emoji:p.emoji,price:p.price,qty:q}:null}).filter(Boolean);
    openDr("Kasse",`<div class="card"><table><tbody>${items.map(i=>`<tr><td><span class="th">${i.emoji}</span>${esc(i.name)}<div class="hint" style="margin:0">${i.qty} × ${fmt(i.price)}</div></td><td class="r">${fmt(i.price*i.qty)}</td></tr>`).join("")}</tbody></table></div><div class="f"><label>Rabattcode (optional)</label><input id="cd" placeholder="WELCOME10" style="text-transform:uppercase"></div><button class="btn g" id="cp" style="width:100%">Jetzt bezahlen</button>`);
    $("cp").onclick=()=>{const d=S.discounts.find(x=>x.active&&x.code===$("cd").value.trim().toUpperCase());const o=makeOrder({customer:S.settings.ownerName||"Test-Kunde",email:S.settings.email,city:"Testkauf",items,paid:true,percent:d?d.percent:0});V.cart={};closeDr();notifyOrder(o);toast("Bestellung #"+o.no+" erstellt")}}}

/* ORDERS */
function pOrders(el){
  const q=V.oq.toLowerCase();
  const list=[...S.orders].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(o=>(!q||o.customer.toLowerCase().includes(q)||String(o.no).includes(q))&&(V.of==="all"||(V.of==="unpaid"&&!o.paid)||(V.of==="unf"&&!o.fulfilled)||(V.of==="ful"&&o.fulfilled)));
  const tabs=[["all","Alle"],["unf","Nicht versendet"],["unpaid","Unbezahlt"],["ful","Versendet"]];
  el.innerHTML=`<h1>Bestellungen<button class="btn g" id="newO">Bestellung simulieren</button></h1>
  <div class="card strip"><div><span>Bestellungen heute</span><b>${S.orders.filter(o=>dkey(o.date)===dkey(new Date())).length}</b></div><div><span>Zu versenden</span><b>${S.orders.filter(o=>!o.fulfilled).length}</b></div><div><span>Unbezahlt</span><b>${S.orders.filter(o=>!o.paid).length}</b></div><div><span>Umsatz gesamt</span><b>${fmt(S.orders.reduce((t,o)=>t+o.total,0))}</b></div></div>
  <div class="card"><div class="tabs">${tabs.map(t=>`<button class="tab ${V.of===t[0]?"on":""}" data-f="${t[0]}">${t[1]}</button>`).join("")}<input id="oq" placeholder="Bestellungen durchsuchen" value="${esc(V.oq)}"></div>
  ${list.length?`<table><thead><tr><th>Bestellung</th><th>Datum</th><th>Kunde</th><th>Zahlung / Versand</th><th>Quelle</th><th class="r">Gesamt</th></tr></thead><tbody>${list.map(o=>`<tr data-id="${o.id}"><td><b>#${o.no}</b></td><td>${fmtDate(o.date)}</td><td>${esc(o.customer)}</td><td>${badges(o)}</td><td>${esc(o.source||"")}</td><td class="r">${fmt(o.total)}</td></tr>`).join("")}</tbody></table>`:`<div class="emp"><h3>${S.orders.length?"Keine Treffer":"Noch keine Bestellungen"}</h3>${S.orders.length?"Passe Suche oder Filter an.":"Sobald jemand kauft, erscheint die Bestellung hier."}</div>`}</div>`;
  $("oq").oninput=e=>{V.oq=e.target.value;const p=e.target.selectionStart;pOrders(el);const n=$("oq");n.focus();n.setSelectionRange(p,p)};
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{V.of=b.dataset.f;pOrders(el)});
  el.querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>openOrder(r.dataset.id));
  $("newO").onclick=()=>fire(1)}
function openOrder(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0),disc=sub-o.total>.001?sub-o.total:0;
  openDr("Bestellung #"+o.no,`<div class="card pad"><b style="font-size:16px">${esc(o.customer)}</b><div class="hint">${fmtDate(o.date)} · ${esc(o.source||"Online-Shop")}</div><div style="margin-top:8px">${badges(o)}</div></div>
  <div class="card"><table><tbody>${o.items.map(i=>`<tr><td><span class="th">${i.emoji||"📦"}</span>${esc(i.name)}<div class="hint" style="margin:0">${fmt(i.price)} × ${i.qty}</div></td><td class="r">${fmt(i.price*i.qty)}</td></tr>`).join("")}</tbody></table></div>
  <div class="card pad"><div class="tg"><span>Zwischensumme</span>${fmt(sub)}</div>${disc?`<div class="tg"><span>Rabatt</span>−${fmt(disc)}</div>`:""}<div class="tg"><b>Gesamt</b><b style="font-size:17px">${fmt(o.total)}</b></div></div>
  <div class="card pad"><div class="ct">Kunde</div>${esc(o.customer)}<br><span class="hint">${esc(o.email||"")}<br>${esc(o.city||"")}</span></div>
  ${o.paid?"":'<button class="btn" id="mp" style="width:100%;margin-bottom:8px">Als bezahlt markieren</button>'}<button class="btn ${o.fulfilled?"":"g"}" id="mf" style="width:100%">${o.fulfilled?"Versand zurücknehmen":"Als versendet markieren"}</button>`);
  const mp=$("mp");if(mp)mp.onclick=()=>{o.paid=true;save();openOrder(id);render()};
  $("mf").onclick=()=>{o.fulfilled=!o.fulfilled;save();openOrder(id);render();toast(o.fulfilled?"Als versendet markiert":"Versand zurückgenommen")}}

/* PRODUCTS */
function pProducts(el){
  const q=V.pq.toLowerCase(),list=S.products.filter(p=>!q||p.name.toLowerCase().includes(q));
  el.innerHTML=`<h1>Produkte<button class="btn g" id="addP">Produkt hinzufügen</button></h1>
  <div class="card">${S.products.length?`<div class="tabs"><input id="pq" placeholder="Produkte durchsuchen" value="${esc(V.pq)}" style="margin:0"></div><table><thead><tr><th>Produkt</th><th>Status</th><th>Bestand</th><th>Typ</th><th class="r">Preis</th></tr></thead><tbody>${list.map(p=>`<tr data-id="${p.id}"><td><span class="th">${p.emoji}</span><b>${esc(p.name)}</b></td><td><span class="badge ${p.active?"bg":""}">${p.active?"Aktiv":"Entwurf"}</span></td><td style="${p.stock<=5?"color:var(--red);font-weight:600":""}">${p.stock===0?"Ausverkauft":p.stock+" auf Lager"}</td><td>${esc(p.category)}</td><td class="r">${fmt(p.price)}</td></tr>`).join("")}</tbody></table>`:`<div class="emp"><h3>Füge dein erstes Produkt hinzu</h3>Starte mit eigenen Produkten oder lade Beispielprodukte.<br><button class="btn g" id="addP2">Produkt hinzufügen</button> <button class="btn" id="smp">Beispielprodukte laden</button></div>`}</div>`;
  $("addP").onclick=()=>openProduct();const a2=$("addP2");if(a2)a2.onclick=()=>openProduct();
  const sm=$("smp");if(sm)sm.onclick=()=>{SAMPLE.forEach(x=>S.products.push({id:uid(),active:true,...x}));save();render();toast("6 Beispielprodukte hinzugefügt")};
  const pq=$("pq");if(pq)pq.oninput=e=>{V.pq=e.target.value;const p=e.target.selectionStart;pProducts(el);const n=$("pq");n.focus();n.setSelectionRange(p,p)};
  el.querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>openProduct(r.dataset.id))}
function openProduct(id){
  const p=id?S.products.find(x=>x.id===id):null;let em=p?p.emoji:EMOJIS[0];
  openDr(p?"Produkt bearbeiten":"Produkt hinzufügen",`<div class="card pad"><div class="f"><label>Titel</label><input id="pN" value="${p?esc(p.name):""}" placeholder="z. B. Premium Hoodie"></div><div class="row2"><div class="f"><label>Preis</label><input id="pP" type="number" step="0.01" min="0" value="${p?p.price:""}"></div><div class="f"><label>Bestand</label><input id="pS" type="number" min="0" value="${p?p.stock:""}"></div></div><div class="f"><label>Produkttyp</label><input id="pC" value="${p?esc(p.category):""}" placeholder="z. B. Bekleidung"></div><div class="f"><label>Symbol</label><div id="ep" style="display:flex;gap:6px;flex-wrap:wrap"></div></div><div class="tg"><div><b>Aktiv im Online-Shop</b><span>Sichtbar für Kunden</span></div><div class="sw ${!p||p.active?"on":""}" id="pA"></div></div></div>
  <button class="btn g" id="pSv" style="width:100%">Speichern</button>${p?'<button class="btn x" id="pD" style="width:100%;margin-top:8px">Produkt löschen</button>':""}`);
  const pick=()=>{$("ep").innerHTML=EMOJIS.map(e=>`<button class="th" data-e="${e}" style="margin:0;${e===em?"border:2px solid var(--green)":""}">${e}</button>`).join("");$("ep").querySelectorAll("button").forEach(b=>b.onclick=()=>{em=b.dataset.e;pick()})};pick();
  $("pA").onclick=e=>e.currentTarget.classList.toggle("on");
  $("pSv").onclick=()=>{const name=$("pN").value.trim(),price=parseFloat($("pP").value),stock=parseInt($("pS").value,10);if(!name||isNaN(price)||price<0){toast("Titel und Preis angeben");return}
    const d={name,price,stock:isNaN(stock)?0:stock,category:$("pC").value.trim()||"Allgemein",emoji:em,active:$("pA").classList.contains("on")};
    if(p)Object.assign(p,d);else S.products.unshift({id:uid(),...d});save();closeDr();render();toast("Produkt gespeichert")};
  const pd=$("pD");if(pd)pd.onclick=()=>{S.products=S.products.filter(x=>x.id!==id);save();closeDr();render();toast("Produkt gelöscht")}}

/* CUSTOMERS */
function pCustomers(el){
  const m={};S.orders.forEach(o=>{const c=m[o.customer]||(m[o.customer]={name:o.customer,email:o.email,city:o.city,n:0,sum:0});c.n++;c.sum+=o.total});
  const l=Object.values(m).sort((a,b)=>b.sum-a.sum);
  el.innerHTML=`<h1>Kunden</h1><div class="card">${l.length?`<table><thead><tr><th>Name</th><th>E-Mail</th><th>Ort</th><th>Bestellungen</th><th class="r">Gesamt ausgegeben</th></tr></thead><tbody>${l.map(c=>`<tr><td><b>${esc(c.name)}</b> <span class="badge ${c.n>1?"bg":""}">${c.n>1?"Stammkunde":"Neu"}</span></td><td>${esc(c.email||"")}</td><td>${esc(c.city||"")}</td><td>${c.n}</td><td class="r">${fmt(c.sum)}</td></tr>`).join("")}</tbody></table>`:`<div class="emp"><h3>Noch keine Kunden</h3>Kunden werden automatisch angelegt, sobald Bestellungen eingehen.</div>`}</div>`}

/* DISCOUNTS */
function pDiscounts(el){
  el.innerHTML=`<h1>Rabatte</h1><div class="grid g2e"><div class="card pad"><div class="ct">Neuen Rabattcode erstellen</div><div class="row2"><div class="f"><label>Code</label><input id="dC" placeholder="SUMMER20" style="text-transform:uppercase"></div><div class="f"><label>Rabatt %</label><input id="dP" type="number" min="1" max="90" placeholder="20"></div></div><button class="btn g" id="dA">Rabattcode erstellen</button></div>
  <div class="card">${S.discounts.length?`<table><tbody>${S.discounts.map(d=>`<tr><td><b>${esc(d.code)}</b><div class="hint" style="margin:0">${d.percent}% Rabatt</div></td><td class="r"><div class="sw ${d.active?"on":""}" data-t="${d.id}" style="display:inline-block"></div></td></tr>`).join("")}</tbody></table>`:`<div class="emp"><h3>Keine Rabattcodes</h3>Erstelle deinen ersten Code.</div>`}</div></div>`;
  $("dA").onclick=()=>{const c=$("dC").value.trim().toUpperCase(),p=parseInt($("dP").value,10);if(!c||!p||p<1||p>90){toast("Code und Prozent angeben");return}S.discounts.unshift({id:uid(),code:c,percent:p,active:true});save();pDiscounts(el);toast("Rabattcode erstellt")};
  el.querySelectorAll("[data-t]").forEach(s=>s.onclick=()=>{const d=S.discounts.find(x=>x.id===s.dataset.t);d.active=!d.active;save();pDiscounts(el)})}

/* NOTIFICATIONS */
function pNotif(el){
  S.notifications.forEach(n=>n.read=true);save();$("bc").style.display="none";
  el.innerHTML=`<h1>Mitteilungen${S.notifications.length?'<button class="btn" id="cl2">Alle löschen</button>':""}</h1><div class="card">${S.notifications.length?`<table><tbody>${S.notifications.slice(0,60).map(n=>`<tr ${n.orderId?`data-id="${n.orderId}"`:""}><td><b>${esc(n.title)}</b><div class="hint" style="margin:0">${esc(n.msg)}</div></td><td class="r hint">${ago(n.date)}</td></tr>`).join("")}</tbody></table>`:`<div class="emp"><h3>Keine Mitteilungen</h3>Neue Bestellungen erscheinen hier.</div>`}</div>`;
  el.querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>openOrder(r.dataset.id));
  const c=$("cl2");if(c)c.onclick=()=>{S.notifications=[];save();pNotif(el)}}

/* SETTINGS */
function pSettings(el){
  el.innerHTML=`<h1>Einstellungen</h1><div class="grid g2e"><div class="card pad"><div class="ct">Shop</div><div class="f"><label>Shop-Name</label><input id="sN" value="${esc(S.settings.shopName)}"></div><div class="f"><label>Dein Name</label><input id="sO" value="${esc(S.settings.ownerName)}"></div><div class="f"><label>E-Mail</label><input id="sE" value="${esc(S.settings.email)}"></div><div class="f"><label>Währung</label><select id="sC">${["EUR","USD","GBP","CHF"].map(c=>`<option ${S.settings.currency===c?"selected":""}>${c}</option>`).join("")}</select></div><button class="btn g" id="sS">Speichern</button></div>
  <div class="card pad"><div class="ct">Gefahrenzone</div><p class="hint" style="margin-bottom:10px">Löscht alle Demo-Daten und startet die Einrichtung neu.</p><button class="btn x" id="rs">Shop zurücksetzen</button></div></div>`;
  $("sS").onclick=()=>{S.settings.shopName=$("sN").value.trim()||"Mein Shop";S.settings.ownerName=$("sO").value.trim();S.settings.email=$("sE").value.trim();S.settings.currency=$("sC").value;save();render();toast("Einstellungen gespeichert")};
  $("rs").onclick=()=>{if(confirm("Wirklich alles zurücksetzen?")){stopAuto();S=blank();save();onboard()}}}

/* ADMIN */
function pAdmin(el){
  const A=S.admin,act=S.products.filter(p=>p.active),mode=(!act.length&&A.mode!=="custom")?"custom":A.mode;
  const tg=(k,t,s)=>`<div class="tg"><div><b>${t}</b><span>${s}</span></div><div class="sw ${A[k]?"on":""}" data-t="${k}"></div></div>`;
  el.innerHTML=`<h1>Admin-Panel <span class="badge" style="background:var(--dark);color:#fff">SIMULATION</span></h1>
  <div class="grid g2e"><div><div class="card pad"><div class="ct">Verkauf konfigurieren</div>
  <div class="seg" id="aM"><button data-m="random" class="${mode==="random"?"on":""}">Zufällig</button><button data-m="pick" class="${mode==="pick"?"on":""}" ${act.length?"":"disabled style='opacity:.4'"}>Produkt</button><button data-m="custom" class="${mode==="custom"?"on":""}">Eigener Betrag</button></div>
  ${mode==="pick"?`<div class="f"><label>Produkt</label><select id="aP">${act.map(p=>`<option value="${p.id}" ${A.productId===p.id?"selected":""}>${esc(p.name)} · ${fmt(p.price)}</option>`).join("")}</select></div>`:""}
  ${mode==="custom"?`<div class="row2"><div class="f"><label>Artikelname</label><input id="aCN" value="${esc(A.customName)}" placeholder="Eigener Artikel"></div><div class="f"><label>Preis</label><input id="aCP" type="number" value="${esc(A.customPrice)}" placeholder="49"></div></div>`:""}
  ${mode!=="random"?`<div class="f"><label>Menge</label><input id="aQ" type="number" min="1" value="${A.qty}"></div>`:""}
  <div class="f"><label>Kundenname (leer = zufällig)</label><input id="aC" value="${esc(A.customer)}" placeholder="z. B. Lena M."></div>
  <div class="f"><label>Anzahl Bestellungen</label><div class="seg" id="aN" style="margin:0">${[1,3,5,10].map(n=>`<button data-n="${n}" class="${A.count===n?"on":""}">${n}×</button>`).join("")}</div></div>
  <button class="btn g" id="aF" style="width:100%">Benachrichtigung senden</button></div>
  <div class="card pad">${tg("paid","Als bezahlt markieren","Bestellungen sofort bezahlt")}${tg("banner","Benachrichtigungs-Banner","Hinweis oben rechts einblenden")}${tg("sound","Verkaufston","Kassenklingel bei neuer Bestellung")}</div></div>
  <div><div class="card pad"><div class="ct">Auto-Simulation</div><div class="tg" style="padding-top:0"><div><b>Laufende Verkäufe</b><span>Sendet automatisch Bestellungen</span></div><div class="sw ${auto?"on":""}" id="aA"></div></div><div class="row2"><div class="f"><label>Min. Sekunden</label><input id="aMi" type="number" min="2" value="${A.autoMin}"></div><div class="f"><label>Max. Sekunden</label><input id="aMa" type="number" min="2" value="${A.autoMax}"></div></div><p class="hint">Läuft, solange dieser Tab geöffnet ist.</p></div>
  <div class="card pad"><div class="ct">Werkzeuge</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="aS">30 Tage Beispieldaten</button><button class="btn" id="aV">+250 Besucher</button><button class="btn x" id="aX">Bestellungen löschen</button></div></div></div></div>`;
  const rr=()=>pAdmin(el);
  $("aM").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.disabled)return;A.mode=b.dataset.m;save();rr()});
  const ap=$("aP");if(ap){A.productId=A.productId||ap.value;ap.onchange=()=>{A.productId=ap.value;save()}}
  const cn=$("aCN");if(cn)cn.oninput=()=>{A.customName=cn.value;save()};const cp=$("aCP");if(cp)cp.oninput=()=>{A.customPrice=cp.value;save()};
  const aq=$("aQ");if(aq)aq.onchange=()=>{A.qty=Math.max(1,parseInt(aq.value,10)||1);save()};
  $("aC").onchange=e=>{A.customer=e.target.value;save()};
  $("aN").querySelectorAll("button").forEach(b=>b.onclick=()=>{A.count=+b.dataset.n;save();rr()});
  el.querySelectorAll("[data-t]").forEach(s=>s.onclick=()=>{A[s.dataset.t]=!A[s.dataset.t];save();rr();if(s.dataset.t==="sound"&&A.sound)chime()});
  $("aF").onclick=()=>{fire(A.count);toast(A.count>1?A.count+" Bestellungen werden gesendet":"Benachrichtigung gesendet")};
  $("aA").onclick=()=>{A.autoMin=Math.max(2,parseInt($("aMi").value,10)||6);A.autoMax=Math.max(A.autoMin,parseInt($("aMa").value,10)||14);save();if(auto){stopAuto();toast("Auto-Simulation gestoppt")}else{startAuto();toast("Auto-Simulation läuft")}rr()};
  $("aS").onclick=()=>{seed();toast("Beispieldaten erzeugt");render()};
  $("aV").onclick=()=>{S.visitors+=250;const k=dkey(new Date());S.sessions[k]=(S.sessions[k]||0)+250;save();toast("+250 Sitzungen")};
  $("aX").onclick=()=>{if(confirm("Alle Bestellungen löschen?")){S.orders=[];S.notifications=[];save();render();toast("Bestellungen gelöscht")}}}

/* ONBOARDING */
function onboard(){
  const o=$("ob");o.classList.add("show");
  o.innerHTML=`<div class="obc"><div class="logo" style="width:auto;color:var(--t1)"><i style="color:#fff">E</i></div><h2>Starte dein Business.</h2><p>Erstelle deinen Online-Shop und verwalte Bestellungen im Browser.</p>
  <div class="f"><label>Dein Name</label><input id="oN" placeholder="Vor- und Nachname"></div><div class="f"><label>E-Mail-Adresse</label><input id="oE" type="email" placeholder="du@beispiel.de"></div><div class="f"><label>Shop-Name</label><input id="oS" placeholder="z. B. Abdi's Store"></div>
  <div class="f"><label>Land</label><select id="oL"><option value="DE|EUR">Deutschland (EUR)</option><option value="AT|EUR">Österreich (EUR)</option><option value="CH|CHF">Schweiz (CHF)</option><option value="US|USD">USA (USD)</option><option value="GB|GBP">Großbritannien (GBP)</option></select></div>
  <button class="btn g" id="oG" style="width:100%;padding:10px">Shop erstellen</button></div>`;
  $("oG").onclick=()=>{const n=$("oN").value.trim(),e=$("oE").value.trim(),s=$("oS").value.trim();
    if(!n||!s){toast("Name und Shop-Name angeben");return}
    const [c,cur]=$("oL").value.split("|");
    S=Object.assign(blank(),{onboarded:true,settings:{shopName:s,ownerName:n.split(" ")[0],email:e,industry:"",country:c,currency:cur,domain:s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")},discounts:[{id:uid(),code:"WELCOME10",percent:10,active:true}],visitors:rint(40,120)});
    save();o.classList.remove("show");V.page="home";render();toast("Dein Shop ist bereit 🎉")}}

if(!S.onboarded)onboard();
render();setTimeout(()=>$("main").classList.remove("anim"),1000);
})();
</script>
</body>
</html>
